<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Snack Bags</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Interactive Snack Bags</h1>
        <p class="instructions">Click to open a bag, click again to take out snacks!</p>

        <div class="snack-bags">
            <!-- Chips Bag -->
            <div class="snack-bag-wrapper">
                <div class="snack-bag red" data-bag-id="0">
                    <div class="bag-body">
                        <div class="bag-top"></div>
                        <div class="bag-label">🥔 Chips Bag</div>
                    </div>
                </div>
                <div class="items-container" id="items-0"></div>
            </div>

            <!-- Candy Bag -->
            <div class="snack-bag-wrapper">
                <div class="snack-bag blue" data-bag-id="1">
                    <div class="bag-body">
                        <div class="bag-top"></div>
                        <div class="bag-label">🍬 Candy Bag</div>
                    </div>
                </div>
                <div class="items-container" id="items-1"></div>
            </div>

            <!-- Fries Bag -->
            <div class="snack-bag-wrapper">
                <div class="snack-bag green" data-bag-id="2">
                    <div class="bag-body">
                        <div class="bag-top"></div>
                        <div class="bag-label">🍟 Fries Bag</div>
                    </div>
                </div>
                <div class="items-container" id="items-2"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
